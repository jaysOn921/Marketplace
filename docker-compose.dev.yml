# Local development database. Usage: docker compose -f docker-compose.dev.yml up -d
# (Alternative without Docker: scripts/setup-local-mysql.sh)
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tzed
      MYSQL_USER: tzed
      MYSQL_PASSWORD: tzed_dev_password
      MYSQL_ROOT_PASSWORD: tzed_root_password
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/docker-init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci']

volumes:
  mysql-data:
